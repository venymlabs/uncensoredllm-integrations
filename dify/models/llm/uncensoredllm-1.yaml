model: uncensoredllm-1
label:
  en_US: UncensoredLLM 1
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 512
    max: 65536
    help:
      en_US: Upper limit on the reply, thinking included. The model reasons before it answers, so keep this at 512 or more.
  - name: reasoning_mode
    label:
      en_US: Reasoning
    type: string
    required: false
    default: extended
    options:
      - extended
      - fast
    help:
      en_US: The model reasons before it answers. "fast" keeps that reasoning short.
  - name: response_format
    use_template: response_format
pricing:
  input: '0.30'
  output: '1.20'
  unit: '0.000001'
  currency: USD
