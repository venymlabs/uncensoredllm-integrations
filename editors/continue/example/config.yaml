name: Main Config
version: 1.0.0
schema: v1
models:
  - name: UncensoredLLM 1
    provider: openai
    model: uncensoredllm-1
    apiBase: https://uncensoredllm.xyz/v1
    apiKey: ${{ secrets.UNCENSOREDLLM_API_KEY }}
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use
    defaultCompletionOptions:
      contextLength: 262144
      maxTokens: 16384
